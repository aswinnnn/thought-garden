<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/assets/htmx.min.js"></script>
    <link rel="stylesheet" href="/settings/style.css">
    <link rel="stylesheet" href="/assets/theme.css">
    <script src="/settings/index.js"></script>
    <script>
        function highlight(s) {
            let options = document.querySelectorAll('.option');
            for (opt of options) {
                opt.setAttribute('data-highlighted', 'false');
            }

            s = document.querySelector(s)
            let str = s.getAttribute('data-highlighted');
            if (str) {
                if (str == "true") {
                    s.setAttribute('data-highlighted', 'false')
                }
                else {
                    s.setAttribute('data-highlighted', 'true')
                }
            }
        }

        function loadSettings() {
            (async function () {
                const set = await window.__TAURI__.tauri.invoke('settings_load');
                document.querySelector('.setting-body').innerHTML = set;
            })()
        }
    </script>
</head>

<body class="light">
    <span class="sidepanel">

        <svg class="backbutt" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"
            onclick="window.__TAURI__.tauri.invoke('redirect', {to: 'create'})">
            <path
                d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
        </svg>
        <div class="sidebar">
            <ol>
                <li class="option general" hx-on:click="highlight('.general')" data-highlighted="true">general</li>
                <li class="option appearance" hx-on:click="highlight('.appearance')" data-highlighted="false">appearance
                </li>
            </ol>
        </div>
    </span>
    <div class="setting-body">
        <script>loadSettings();</script>
    </div>
</body>

</html>
